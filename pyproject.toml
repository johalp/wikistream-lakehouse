[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikistream-lakehouse"
version = "0.1.0"
description = "Real-time Wikimedia event pipeline using Python and Apache Kafka."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.15,<3",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wikistream"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
